<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{% block title %}procmon{% endblock %}</title>

<!-- PWA: standard manifest + install support (Android/Chrome, and most others) -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f1115">

<!-- PWA: iOS-specific. Safari ignores manifest.json's own icon/display
     settings almost entirely for "Add to Home Screen" -- these tags are
     what actually control the iOS home-screen icon and standalone
     (no browser chrome) display there. -->
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="procmon">

<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">

<!-- Rich link previews (iMessage, Slack, etc.) -- these render on EVERY page,
     including login.html, deliberately: any unauthenticated fetch (e.g. a
     link-preview crawler with no session cookie) gets redirected to /login
     by @login_required, so that's the page whose meta tags actually end up
     getting read for a link shared while logged out. Static and generic on
     purpose -- crash notifications already put the real specifics (which
     process, which project) directly in the message text itself; this tag
     set exists only to turn a bare "Tap to Load Preview" into a branded
     card, not to expose live process data to an unauthenticated fetcher. -->
<meta property="og:title" content="procmon">
<meta property="og:description" content="Process monitor">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ request.url_root }}static/icon-512.png">
<meta name="twitter:card" content="summary">

<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #2a2f3a; --text: #e6e8eb; --muted: #8b94a3;
    --green: #34c759; --red: #ff453a; --amber: #ff9f0a;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0; max-width: 720px; margin-inline: auto; line-height: 1.5;
    /* Safe-area padding matters specifically in standalone PWA mode on iOS,
       where there's no browser chrome to naturally clear the notch / home
       indicator -- content can otherwise sit underneath them. Falls back to
       the plain 16px on any browser/device without safe-area support at all. */
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  a { color: #6ea8fe; text-decoration: none; }
  h1, h2 { margin: 0.4em 0; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
  .dot.green { background: var(--green); }
  .dot.red { background: var(--red); }
  .dot.amber { background: var(--amber); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row > * {
    min-width: 0;
    /* Flexbox default -- flex items refuse to shrink below their content's
       natural, unwrapped size (min-width: auto) unless told otherwise. That
       silently defeats overflow/ellipsis truncation on anything nested
       inside a .row, like the long, unbreakable command path on a process
       card -- confirmed directly: without this, the command text overflows
       the card and the whole page rather than truncating with "...". */
  }
  .muted { color: var(--muted); font-size: 0.85em; }
  button, .btn {
    background: #23262f; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font-size: 0.9em; cursor: pointer;
  }
  button.primary { background: #2f6fed; border-color: #2f6fed; }
  button.danger { background: #442; border-color: #a33; }
  input, textarea {
    background: #0d0f13; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; width: 100%; font-family: inherit; margin-bottom: 8px;
  }
  .command {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.8em; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer;
  }
  .command.expanded {
    white-space: normal; word-break: break-all; overflow-wrap: break-word;
  }
  label { font-size: 0.85em; color: var(--muted); display: block; margin-bottom: 2px; }
  pre.log {
    background: #05060a; border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    max-height: 400px; overflow-y: auto; font-size: 0.8em; white-space: pre-wrap; word-break: break-all;
  }
  form.inline { display: inline; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  /* Pull-to-refresh: the home-screen app (standalone mode) has no browser
     pull-down of its own, so the page draws one. The browser's own overscroll
     refresh is turned off so the two never fire together. */
  html, body { overscroll-behavior-y: contain; }
  #ptr {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 8px); z-index: 1000;
    width: 36px; height: 36px; margin-left: -18px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    opacity: 0; transform: translateY(-60px); pointer-events: none;
  }
  #ptr.ready { color: var(--text); border-color: #2f6fed; }
  #ptr.spin span { display: inline-block; animation: ptr-spin 0.8s linear infinite; }
  @keyframes ptr-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
{% block body %}{% endblock %}
<div id="ptr" aria-hidden="true"><span>&#8635;</span></div>
<script>
  // Pull down from the top of the page to reload it. Only a drag that starts
  // with the page already at the top counts, never one that starts inside a
  // scrolled log box, and never while typing in a field (a reload would throw
  // the text away).
  (() => {
    const ptr = document.getElementById("ptr");
    const THRESHOLD = 70;
    let startY = null, pull = 0;
    const scrolledInner = (el) => {
      for (; el && el !== document.body; el = el.parentElement)
        if (el.scrollTop > 0) return true;
      return false;
    };
    const show = (d) => {
      ptr.style.opacity = Math.min(1, d / THRESHOLD);
      ptr.style.transform = `translateY(${Math.min(d, THRESHOLD) - 60 + 20}px) rotate(${d * 3}deg)`;
      ptr.classList.toggle("ready", d >= THRESHOLD);
    };
    const reset = () => {
      startY = null; pull = 0;
      ptr.style.transition = "transform 0.2s, opacity 0.2s";
      ptr.style.opacity = 0; ptr.style.transform = "translateY(-60px)";
      setTimeout(() => { ptr.style.transition = ""; }, 200);
    };
    window.addEventListener("touchstart", (e) => {
      const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (window.scrollY > 0 || e.touches.length !== 1 || typing || scrolledInner(e.target)) return;
      startY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener("touchmove", (e) => {
      if (startY === null) return;
      const dy = e.touches[0].clientY - startY;
      if (window.scrollY > 0) { reset(); return; }
      if (dy <= 0) { pull = 0; show(0); return; }   // back above the start: nothing armed, can still pull again
      pull = dy * 0.5;   // resistance, so it takes a deliberate pull
      show(pull);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    window.addEventListener("touchend", () => {
      if (startY === null) return;
      if (pull >= THRESHOLD) {
        ptr.classList.add("spin");
        ptr.style.transform = "translateY(20px)";
        location.reload();
      } else reset();
    });
    window.addEventListener("touchcancel", reset);
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((err) => {
        // Non-fatal -- the app works fine without a service worker,
        // this just means the install prompt may not appear on some
        // browsers. Commonly fails over plain HTTP (most browsers
        // require HTTPS or localhost for service workers) -- expected
        // in that case, not a real error worth surfacing to the user.
        console.log("Service worker registration failed (expected over plain HTTP):", err);
      });
    });
  }
</script>
</body>
</html>
